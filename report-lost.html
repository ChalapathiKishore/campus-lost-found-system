<!DOCTYPE html>
<html>
<head>
    <title>Report Lost Item</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 min-h-screen">

<div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-10">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">

        <div>
            <p class="text-blue-100 text-sm font-medium">
                Campus Lost & Found
            </p>

            <h1 class="text-2xl sm:text-3xl font-bold text-white">
                Report Lost Item
            </h1>
        </div>

        <!-- Back to Dashboard -->
        <a href="dashboard.html"
           class="bg-white/15 hover:bg-white/25 border border-white/20
                  text-white px-4 py-2.5 rounded-xl font-semibold
                  transition whitespace-nowrap">
            ← Dashboard
        </a>

    </div>


    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

        <!-- Card Header -->
        <div class="bg-gradient-to-r from-red-500 to-pink-500 px-5 sm:px-8 py-5">

            <h2 class="text-xl sm:text-2xl font-bold text-white">
                Lost Item Details
            </h2>

            <p class="text-red-100 text-sm mt-1">
                Provide accurate details to help recover your item
            </p>

        </div>


        <div class="p-5 sm:p-8">

            <div class="space-y-5">

                <!-- Item Name -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Item Name
                    </label>

                    <input
                        id="item"
                        placeholder="Example: Black Wallet"
                        class="w-full border border-gray-300 p-3 rounded-xl
                               focus:ring-2 focus:ring-red-500
                               focus:border-red-500 outline-none">

                </div>


                <!-- Description -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the item, colour, brand, identifying marks, etc."
                        class="w-full border border-gray-300 p-3 rounded-xl
                               focus:ring-2 focus:ring-red-500
                               focus:border-red-500 outline-none resize-none"></textarea>

                </div>


                <!-- Location -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Where Lost
                    </label>

                    <input
                        id="location"
                        placeholder="Example: College Library"
                        class="w-full border border-gray-300 p-3 rounded-xl
                               focus:ring-2 focus:ring-red-500
                               focus:border-red-500 outline-none">

                </div>


                <!-- Photo -->
                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Item Photo
                    </label>

                    <div class="grid grid-cols-2 gap-3">

                        <!-- Camera -->
                        <label
                            for="lostCameraPhoto"
                            class="flex items-center justify-center gap-2
                                   bg-blue-500 hover:bg-blue-600
                                   text-white font-semibold
                                   p-3 rounded-xl cursor-pointer
                                   transition text-center">

                            <span>📷</span>
                            <span>Take Photo</span>

                        </label>


                        <!-- File -->
                        <label
                            for="lostPhoto"
                            class="flex items-center justify-center gap-2
                                   bg-gray-600 hover:bg-gray-700
                                   text-white font-semibold
                                   p-3 rounded-xl cursor-pointer
                                   transition text-center">

                            <span>📁</span>
                            <span>Choose File</span>

                        </label>

                    </div>


                    <!-- Camera input -->
                    <input
                        type="file"
                        id="lostCameraPhoto"
                        accept="image/*"
                        capture="environment"
                        class="hidden">


                    <!-- Existing file input -->
                    <input
                        type="file"
                        id="lostPhoto"
                        accept="image/*"
                        class="hidden">


                    <p id="lostPhotoName"
                       class="text-sm text-gray-500 mt-3">
                        No photo selected
                    </p>

                </div>


                <!-- Submit -->
                <button
                    onclick="reportLost()"
                    class="w-full bg-gradient-to-r from-red-500 to-pink-500
                           hover:from-red-600 hover:to-pink-600
                           text-white font-bold p-3.5 rounded-xl
                           shadow-md hover:shadow-lg transition">

                    Report Lost Item

                </button>

            </div>

        </div>

    </div>


    <p class="text-center text-blue-100 text-sm mt-6">
        Campus Lost & Found Management System
    </p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/env.js"></script>
<script src="js/app.js"></script>

<script>
    checkStudentLogin()
</script>


<!-- Camera/File selection -->
<script>

document.getElementById("lostCameraPhoto")?.addEventListener("change", function(){

    if(this.files[0]){

        document.getElementById("lostPhotoName").textContent =
            "📷 " + this.files[0].name

        // Copy camera file to the existing input is not possible directly.
        // reportLost() will handle the camera file separately.

    }

})


document.getElementById("lostPhoto")?.addEventListener("change", function(){

    if(this.files[0]){

        document.getElementById("lostPhotoName").textContent =
            "📁 " + this.files[0].name

    }

})

</script>


<!-- Toast -->
<div id="toast"
     class="fixed bottom-5 right-5 px-5 py-3 rounded-xl text-white
            bg-green-500 opacity-0 transition-opacity duration-300
            pointer-events-none shadow-lg">
    Message
</div>

</body>
</html>
